<script>
const API = 'https://suivi-presence-success.vercel.app/api';

function isAFCFormation(f) { return (f||'').toUpperCase().trim().startsWith('AFC'); }
function hMatinDuree(f)    { return isAFCFormation(f) ? 4.0 : 3.5; }

let donnees     = null;
let retardsData = {};

const MOIS_NOMS = ['','Janvier','Février','Mars','Avril','Mai','Juin',
                   'Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

// ✅ UN SEUL DOMContentLoaded — point d'entrée unique
window.addEventListener('DOMContentLoaded', async () => {
    const now = new Date();
    document.getElementById('sel-mois').value  = now.getMonth() + 1;
    document.getElementById('sel-annee').value = now.getFullYear();
    await chargerApprenants();
});

// ── Chargement apprenants ─────────────────────────────────────────────────
async function chargerApprenants() {
    const sel = document.getElementById('sel-apprenant');
    if (!sel) { console.error('❌ #sel-apprenant introuvable'); return; }
    sel.innerHTML = '<option value="">⏳ Chargement...</option>';
    try {
        const resp = await fetch(`${API}/rapport/apprenants`);
        console.log('📡 Status apprenants:', resp.status);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

        const raw   = await resp.json();
        // Gère tableau direct OU objet enveloppé
        const liste = Array.isArray(raw) ? raw : (raw.apprenants || raw.data || []);
        console.log(`✅ ${liste.length} apprenants reçus`);

        if (liste.length === 0) throw new Error('Liste vide reçue');

        sel.innerHTML = '<option value="">-- Sélectionner un(e) apprenant(e) --</option>';
        liste
            .slice()
            .sort((a, b) => a.localeCompare(b, 'fr', { sensitivity: 'base' }))
            .forEach(nom => {
                const opt       = document.createElement('option');
                opt.value       = nom;
                opt.textContent = nom;
                sel.appendChild(opt);
            });

    } catch (e) {
        console.error('❌ chargerApprenants:', e);
        sel.innerHTML = '<option value="">⚠️ Erreur — rechargez la page</option>';
        showAlert('error', `Impossible de charger les apprenants : ${e.message}`);
    }
}

// ── Chargement données ────────────────────────────────────────────────────
async function chargerDonnees() {
    const nomComplet = document.getElementById('sel-apprenant').value;
    const mois       = document.getElementById('sel-mois').value;
    const annee      = document.getElementById('sel-annee').value;

    if (!nomComplet) { showAlert('error', 'Veuillez sélectionner un(e) apprenant(e).'); return; }
    if (!mois || !annee) { showAlert('error', "Veuillez sélectionner le mois et l'année."); return; }

    const btn = document.getElementById('btn-charger');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Chargement...';
    clearAlert();

    try {
        const url  = `${API}/rapport/mensuel?nomComplet=${encodeURIComponent(nomComplet)}&mois=${mois}&annee=${annee}`;
        const resp = await fetch(url);
        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.error || `Erreur HTTP ${resp.status}`);
        }
        donnees = await resp.json();

        if (!donnees.attendances || donnees.attendances.length === 0) {
            showAlert('info', `Aucune présence pour ${nomComplet} en ${MOIS_NOMS[+mois]} ${annee}.`);
            ['stats-section','preview-section','retards-section','pdf-section']
                .forEach(id => document.getElementById(id).classList.add('hidden'));
        } else {
            retardsData = {};
            afficherApercu();
            showAlert('success', `${donnees.attendances.length} jour(s) chargés pour ${nomComplet}.`);
        }
    } catch (e) {
        console.error(e);
        showAlert('error', `Erreur : ${e.message}`);
    } finally {
        btn.disabled  = false;
        btn.innerHTML = '🔍 Charger les données';
    }
}

// ── Aperçu avec signatures ────────────────────────────────────────────────
function afficherApercu() {
    if (!donnees) return;
    const tbody = document.getElementById('preview-tbody');
    const tfoot = document.getElementById('preview-tfoot');
    let totalHeures = 0, totalDemiJ = 0;
    const joursPresent = new Set();
    tbody.innerHTML = '';

    donnees.attendances.forEach(day => {
        const formation       = day.matin?.formation       || day.apresMidi?.formation       || '—';
        const formateurNom    = day.matin?.formateurNom    || day.apresMidi?.formateurNom    || '';
        const formateurPrenom = day.matin?.formateurPrenom || day.apresMidi?.formateurPrenom || '';
        const retard          = retardsData[day.date] || 0;
        const hMatin          = day.matin     ? hMatinDuree(formation) : 0;
        const hAM             = day.apresMidi ? 3.5 : 0;
        const hJour           = Math.max(0, hMatin + hAM - retard);
        totalHeures += hJour;
        if (day.matin)              totalDemiJ++;
        if (day.apresMidi)          totalDemiJ++;
        if (day.matin||day.apresMidi) joursPresent.add(day.date);

        // Signatures — tous les noms de champs possibles selon version API
        const sigMatinApp = day.matin?.signatureApprenant     || null;
        const sigAMApp    = day.apresMidi?.signatureApprenant || null;
        const sigForm     = day.matin?.signatureFormateur            ||
                            day.matin?.signatureFormateurMatin       ||
                            day.apresMidi?.signatureFormateur        ||
                            day.apresMidi?.signatureFormateurApresMidi || null;

        function cellSig(data, label) {
            if (data && data.startsWith('data:image')) {
                return `<div class="sig-cell">
                    <img src="${data}" alt="sig ${label}">
                    <span class="sig-label">✅ Signé</span>
                </div>`;
            }
            return `<span class="sig-absent-label">✗ Absent(e)</span>`;
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><strong>${formatDateFr(day.date)}</strong></td>
            <td style="font-size:12px;">${formation}</td>
            <td>${cellSig(sigMatinApp, 'matin')}</td>
            <td>${cellSig(sigAMApp,    'après-midi')}</td>
            <td>${cellSig(sigForm,     'formateur')}</td>
            <td style="font-size:12px;">${formateurPrenom} ${formateurNom}</td>
            <td id="retard-preview-${day.date}">${retard > 0 ? `-${retard}h` : '—'}</td>
            <td><strong>${formatHeures(hJour)}</strong></td>`;
        tbody.appendChild(tr);
    });

    tfoot.innerHTML = `<tr class="total-row">
        <td colspan="5" style="text-align:right;padding-right:16px;">
            <strong>TOTAL PÉRIODE</strong>
        </td>
        <td>—</td>
        <td id="total-heures-preview">
            <strong>${formatHeures(totalHeures)}</strong>
        </td>
    </tr>`;

    document.getElementById('stat-jours-present').textContent = joursPresent.size;
    document.getElementById('stat-demi-jour').textContent     = totalDemiJ;
    document.getElementById('stat-heures').textContent        = formatHeures(totalHeures);

    ['stats-section','preview-section','retards-section','pdf-section']
        .forEach(id => document.getElementById(id).classList.remove('hidden'));
}

// ── Retards ───────────────────────────────────────────────────────────────
function ajouterRetard() {
    const id  = Date.now();
    const div = document.createElement('div');
    div.className = 'retard-entry';
    div.id = `re-${id}`;
    div.innerHTML = `
        <input type="date" onchange="majRetard()" id="rd-date-${id}">
        <select onchange="majRetard()" id="rd-h-${id}">
            <option value="1">— 1h</option>
            <option value="2">— 2h</option>
            <option value="3">— 3h</option>
        </select>
        <button class="btn-rm-retard"
            onclick="document.getElementById('re-${id}').remove();majRetard();">×</button>`;
    document.getElementById('retards-list').appendChild(div);
}

function majRetard() {
    retardsData = {};
    document.querySelectorAll('.retard-entry').forEach(div => {
        const id     = div.id.replace('re-','');
        const dateEl = document.getElementById(`rd-date-${id}`);
        const hEl    = document.getElementById(`rd-h-${id}`);
        if (dateEl?.value)
            retardsData[dateEl.value] = (retardsData[dateEl.value]||0) + parseInt(hEl.value);
    });
    if (!donnees) return;
    let totalHeures = 0;
    donnees.attendances.forEach(day => {
        const fm     = day.matin?.formation || day.apresMidi?.formation || '';
        const retard = retardsData[day.date] || 0;
        const h      = Math.max(0,(day.matin?hMatinDuree(fm):0)+(day.apresMidi?3.5:0)-retard);
        totalHeures += h;
        const cell = document.getElementById(`retard-preview-${day.date}`);
        if (cell) cell.textContent = retard > 0 ? `-${retard}h` : '—';
    });
    const totalEl = document.getElementById('total-heures-preview');
    if (totalEl) totalEl.innerHTML = `<strong>${formatHeures(totalHeures)}</strong>`;
    document.getElementById('stat-heures').textContent = formatHeures(totalHeures);
}

// ── Génération PDF ────────────────────────────────────────────────────────
async function genererPDF() {
    if (!donnees) return;
    const btn = document.getElementById('btn-pdf');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Génération en cours...';

    try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
        const nomComplet = document.getElementById('sel-apprenant').value;
        const mois       = parseInt(document.getElementById('sel-mois').value);
        const annee      = parseInt(document.getElementById('sel-annee').value);
        const pageW      = doc.internal.pageSize.getWidth();
        const pageH      = doc.internal.pageSize.getHeight();
        const marg       = 10;

        // Logo
        let logoB64 = null;
        try { logoB64 = await chargerImageBase64('img/Logo%20success%20Formation%20rec.PNG'); } catch(_) {}
        if (logoB64) doc.addImage(logoB64, 'PNG', marg, 6, 28, 14);

        // En-tête
        doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(206,42,69);
        doc.text("FEUILLE D'EMARGEMENT MENSUELLE", pageW/2, 12, { align:'center' });
        doc.setFontSize(11); doc.setTextColor(92,100,107);
        doc.text(`Periode : ${MOIS_NOMS[mois]} ${annee}`, pageW/2, 19, { align:'center' });
        doc.setFontSize(11); doc.
</head>
<body>
<div class="container">

    <a href="index.html" class="nav-back">← Retour à l'interface formateur</a>

    <header>
        <div class="logo">
            <img src="img/Logo%20success%20Formation%20rec.PNG" alt="Success Formation">
            <span>Success Formation</span>
        </div>
        <h1>📋 Récapitulatif Mensuel d'Émargement</h1>
        <p class="subtitle">Génération des feuilles de présence PDF</p>
    </header>

    <!-- ═══ PARAMÈTRES ══════════════════════════════════════════════════════ -->
    <div class="card">

        <div class="form-row">

                abel for="sel-apprenant">👤 Apprenant(e) *</label>
                <select id="sel-apprenant">
                    <option value="">⏳ Chargement...</option>

        <div class="form-row" style="margin-top:12px;">

// ═══════════════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════════════

function isAFCFormation(f) { return (f || '').toUpperCase().trim().startsWith('AFC'); }
function hMatinDuree(f)    { return isAFCFormation(f) ? 4.0 : 3.5; }
